[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "my-agent"
version = "0.1.0"
description = "My coding agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0",
    "textual>=8.2.8",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai", "src/agent", "src/coding", "src/evaluation"]
